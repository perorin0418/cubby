# Debian・Fedora の sshd_config は先頭で sshd_config.d/*.conf を読み込み、先に読んだ値が優先される。
# 転送系（AllowTcpForwarding など）は Desktop が何を使うか未確認なので既定のまま。
# ログインできるのは、ホストのログインユーザー（ctr-entrypoint が登録する）だけ。
# 公開鍵は /etc/ssh/ctr-authorized_keys/<ユーザー名>（ホストからマウント）にあるユーザーしか入れない。
ListenAddress 127.0.0.1
HostKey /etc/ssh/ctr-hostkeys/ssh_host_ed25519_key
AuthorizedKeysFile /etc/ssh/ctr-authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# セッションに渡す環境変数（ログインシェルでなくても効くように。/etc/profile.d/cubby-tools.sh と同じ）
SetEnv JAVA_HOME=/opt/java DOCKER_BUILDKIT=0 COMPOSE_BAKE=false
