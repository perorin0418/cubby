# Debian の sshd_config は先頭で sshd_config.d/*.conf を読み込み、先に読んだ値が優先される。
# 転送系（AllowTcpForwarding など）は Desktop が何を使うか未確認なので既定のまま。
ListenAddress 127.0.0.1
HostKey /etc/ssh/ctr-hostkeys/ssh_host_ed25519_key
AuthorizedKeysFile /etc/ssh/ctr-authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers dev
